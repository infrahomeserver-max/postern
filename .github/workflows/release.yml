name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # only the packaged desktop build needs Chromium; electron-builder fetches it itself
jobs:
  tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with: { name: tarball, path: "dist/postern-*.tar.gz" }
  deb:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx vite build web
      - name: Build .deb (bundles this runner's Node.js)
        run: bash packaging/build-deb.sh "$(command -v node)" dist ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: "dist/postern-lite_*.deb"
  portable:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64 }
          - { os: linux, arch: arm64 }
          - { os: macos, arch: arm64 }
          - { os: macos, arch: x64 }
          - { os: windows, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx vite build web
      - name: Bundle with the official Node.js for this platform (checksum-verified)
        run: bash packaging/build-portable.sh ${{ matrix.os }} ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}-${{ matrix.arch }}
          path: "dist/postern-*-${{ matrix.os }}-${{ matrix.arch }}.*"
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb/ai = the file-name parts of THIS job's own Linux files; every job must upload only its own files,
          # because the publish job merges all artifacts into one folder and same-named files would overwrite each other
          - { name: linux-x64,   runner: ubuntu-24.04,     args: "--linux --x64",   deb: amd64, ai: x86_64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, args: "--linux --arm64", deb: arm64, ai: arm64 }
          - { name: macos-arm64, runner: macos-latest,     args: "--mac --arm64",   deb: none,  ai: none }
          - { name: macos-x64,   runner: macos-15-intel,   args: "--mac --x64",     deb: none,  ai: none }
          - { name: windows-x64, runner: windows-2022,     args: "--win --x64",     deb: none,  ai: none }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx vite build web
      - name: fpm for Linux arm64 (electron-builder ships no arm64 fpm)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Shell security tests (Linux x64 only, virtual display)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64
          npx electron-builder --linux dir --x64 --publish never
          EL_BIN="$PWD/dist-electron/linux-unpacked/postern" xvfb-run -a node tests/electron-shell.mjs | tee shell-test.out
          grep -q "RESULT 20/20" shell-test.out
      - name: Build installers (unsigned)
        run: npx electron-builder ${{ matrix.args }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Build the .deb ourselves and verify it (electron-builder's .deb was sometimes corrupt on CI)
        if: startsWith(matrix.name, 'linux')
        run: |
          if [ "${{ matrix.name }}" = linux-arm64 ]; then arch=arm64; dir=dist-electron/linux-arm64-unpacked; else arch=amd64; dir=dist-electron/linux-unpacked; fi
          bash packaging/build-desktop-deb.sh "$dir" "$arch" dist-electron
          (cd dist-electron && sha256sum "Postern-$(node -p "require('../package.json').version")-linux-$arch.deb" > "verify-${{ matrix.name }}.sha256" && cat "verify-${{ matrix.name }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          compression-level: 0
          path: |
            dist-electron/verify-*.sha256
            dist-electron/Postern-*-linux-${{ matrix.deb }}.deb
            dist-electron/Postern-*-linux-${{ matrix.ai }}.AppImage
            dist-electron/Postern-*.dmg
            dist-electron/Postern-*.zip
            dist-electron/Postern-*.exe
  publish:
    needs: [tarball, deb, portable, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Verify every .deb survived the artifact transfer (fails the release instead of publishing a broken file)
        run: |
          cd out
          sha256sum -c verify-*.sha256
          for f in Postern-*.deb postern-lite_*.deb; do dpkg-deb -I "$f" >/dev/null; dpkg-deb --fsys-tarfile "$f" | tar -t >/dev/null; echo "ok $f"; done
      - name: One-line installer (attached to every release)
        run: bash -n packaging/install.sh && cp packaging/install.sh out/install.sh
      - name: Checksums
        run: cd out && sha256sum postern-*.tar.gz postern-*.zip postern-lite_*.deb Postern-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/postern-*.tar.gz
            out/postern-*.zip
            out/postern-lite_*.deb
            out/Postern-*
            out/SHA256SUMS
            out/install.sh
          generate_release_notes: true
  verify-release:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Download the published .deb files again and test them
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          for f in "Postern-${GITHUB_REF_NAME#v}-linux-amd64.deb" "Postern-${GITHUB_REF_NAME#v}-linux-arm64.deb"; do
            curl -fsSL --retry 3 -o "$f" "$base/$f"
            dpkg-deb -I "$f" >/dev/null
            dpkg-deb --fsys-tarfile "$f" | tar -t >/dev/null
            echo "ok $f"
          done
