name: Security audit
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 5 * * 1" }]
jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
